name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node tests
        run: node --test tests/*.test.mjs

      - name: Python syntax
        run: python3 -m py_compile scripts/export_tokenizers.py scripts/patch_tokenizers.py

      - name: Verify bundled tokenizer checksums
        run: sha256sum -c models/CHECKSUMS.sha256
